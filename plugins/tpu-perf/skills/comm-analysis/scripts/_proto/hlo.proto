// Vendored subset of xla.HloModuleProto and friends from openxla/xla.
//
// Source: https://github.com/openxla/xla
//   - xla/service/hlo.proto       (HloModuleProto, HloComputationProto, HloInstructionProto)
//   - xla/xla_data.proto          (ShapeProto, OpMetadata, ChannelHandle,
//                                  FrontendAttributes, ReplicaGroup, OpSharding)
//
// IMPORTANT: Field numbers MUST match upstream so the binary wire format of
// `*.hlo_proto.pb` files deserializes correctly. If upstream renumbers a
// field this vendored copy must be updated in lockstep.
//
// Only fields needed by the comm-analysis skill are vendored. Unknown fields
// are preserved by proto3 by default (google.protobuf >= 3.5), so the subtree
// for `sharding` round-trips bit-for-bit even though most of OpSharding is
// elided here.
//
// To regenerate the python bindings:
//   protoc --python_out=. hlo.proto
// from this directory.

syntax = "proto3";

package xla;

// ---- xla_data.proto ---------------------------------------------------------

// xla_data.proto: ShapeProto
message ShapeProto {
  reserved 1;
  int32 element_type = 2;
  repeated int64 dimensions = 3;
  repeated ShapeProto tuple_shapes = 4;
}

// xla_data.proto: OpMetadata
message OpMetadata {
  string op_type = 1;
  string op_name = 2;
  string source_file = 3;
  int32 source_line = 4;
}

// xla_data.proto: ChannelHandle
message ChannelHandle {
  int64 handle = 1;
  enum ChannelType {
    CHANNEL_TYPE_INVALID = 0;
    DEVICE_TO_DEVICE = 1;
    DEVICE_TO_HOST = 2;
    HOST_TO_DEVICE = 3;
  }
  ChannelType type = 2;
}

// xla_data.proto: FrontendAttributes
message FrontendAttributes {
  map<string, string> map = 1;
}

// xla_data.proto: ReplicaGroup
message ReplicaGroup {
  repeated int64 replica_ids = 1;
}

// xla_data.proto: IotaReplicaGroupListProto
message IotaReplicaGroupListProto {
  int64 num_replica_groups = 1;
  int64 num_devices_per_group = 2;
  repeated int64 iota_reshape_dims = 3;
  repeated int32 iota_transpose_perm = 4;
}

// xla_data.proto: CollectiveDeviceListProto
message CollectiveDeviceListProto {
  repeated ReplicaGroup replica_groups = 1;
  reserved 2;
}

// xla_data.proto: MeshProto (used by MeshAxesReplicaGroupListProto)
message MeshProto {
  message MeshAxis {
    string name = 1;
    int64 size = 2;
  }
  repeated MeshAxis axes = 1;
  repeated int64 device_ids = 2;
}

// xla_data.proto: AxisRefProto
message AxisRefProto {
  message SubAxis {
    int64 pre_size = 1;
    int64 size = 2;
  }
  int64 mesh_axis_index = 1;
  SubAxis sub_axis_info = 2;
}

// xla_data.proto: MeshAxesReplicaGroupListProto
//   Modern collective device list flavor where replica groups are described
//   by which mesh axes the collective contracts over, not as an enumerated
//   list of replica IDs. Used heavily by Shardy / SDY-lowered HLO.
message MeshAxesReplicaGroupListProto {
  MeshProto mesh = 1;
  repeated AxisRefProto axes = 2;
}

// xla_data.proto: OpSharding (minimal — keeps the top-level message on
// HloInstructionProto.sharding=40 with the correct shape so wire-level
// round-trip works. Unknown fields are preserved by proto3 by default.)
message OpSharding {
  enum Type {
    REPLICATED = 0;
    MAXIMAL = 1;
    TUPLE = 2;
    OTHER = 3;
    MANUAL = 4;
    UNKNOWN = 5;
    UNREDUCED = 6;
  }
  Type type = 1;
}

// ---- hlo.proto --------------------------------------------------------------

// hlo.proto: HloInstructionProto
message HloInstructionProto {
  string name = 1;
  string opcode = 2;
  ShapeProto shape = 3;
  OpMetadata metadata = 7;
  int64 id = 35;
  // Producer→consumer edges: indices into the parent computation's instructions
  // by HloInstructionProto.id. memory-profile uses these to compute each
  // logical buffer's last-use position when sweeping the entry schedule.
  repeated int64 operand_ids = 36;
  OpSharding sharding = 40;
  // Deprecated upstream — still populated for backward-compat in some HLOs.
  repeated ReplicaGroup replica_groups = 49;
  int64 channel_id = 26;
  FrontendAttributes frontend_attributes = 68;
  // Upstream-call wrapper: when XLA emits a `call` instruction wrapping the
  // real collective inside an `async_computation`, this is how we walk back
  // to the underlying collective. Repeated int64, packed.
  repeated int64 called_computation_ids = 38;
  // Modern collective device list. Upstream uses three SIBLING fields on
  // HloInstructionProto (NOT a single `oneof`):
  //   collective_device_list           = 87  (legacy enumerated groups)
  //   iota_collective_device_list      = 92  (Iota expansion)
  //   mesh_axes_replica_group_list     = 93  (Shardy mesh-axis form)
  // All three are plain fields; only one is populated per instruction in
  // current XLA, but readers must check all three.
  CollectiveDeviceListProto collective_device_list = 87;
  IotaReplicaGroupListProto iota_collective_device_list = 92;
  MeshAxesReplicaGroupListProto mesh_axes_replica_group_list = 93;
}

// hlo.proto: HloComputationProto
message HloComputationProto {
  string name = 1;
  repeated HloInstructionProto instructions = 2;
  int64 id = 5;
}

// hlo.proto: HloProto (outer wrapper used by *.hlo_proto.pb files)
message HloProto {
  reserved 2;
  HloModuleProto hlo_module = 1;
  // Static buffer layout decided at compile time. memory-profile reads this
  // to attribute the HBM peak to HLO instructions and op_names. The runtime
  // allocator events on /host:CPU are an UNRELIABLE fallback because the
  // trace window often misses the alloc events for long-lived buffers
  // (weights / optimizer state) that were allocated before capture started.
  BufferAssignmentProto buffer_assignment = 3;
}

// hlo.proto: HloModuleProto
message HloModuleProto {
  string name = 1;
  string entry_computation_name = 2;
  repeated HloComputationProto computations = 3;
  // Upstream type is xla.ProgramShapeProto. We do not need to introspect it;
  // declared as bytes so the field is preserved on round-trip without
  // requiring us to vendor ProgramShapeProto/LayoutProto/etc.
  bytes host_program_shape = 4;
  int64 id = 5;
  int64 entry_computation_id = 6;
  // Per-computation linear instruction sequence chosen by the scheduler.
  // memory-profile uses sequences[entry_computation_id] to walk allocations
  // chronologically when locating the static peak moment.
  HloScheduleProto schedule = 7;
}

// ---- Buffer assignment (subset of hlo.proto needed by memory-profile) -----

// hlo.proto: LogicalBufferProto
//   One LogicalBufferProto per (instruction × shape_index) tuple in the
//   compiled module. Its `size` is the raw byte count; XLA's HeapSimulator
//   then assigns it to a slot inside one BufferAllocationProto.
message LogicalBufferProto {
  // hlo.proto: LogicalBufferProto.Location
  message Location {
    // Field 1 reserved upstream (was the now-removed `computation_name`).
    reserved 1;
    string instruction_name = 2;
    repeated int64 shape_index = 3;
    int64 instruction_id = 4;
  }
  int64 id = 1;
  int64 size = 2;
  Location defined_at = 3;
  int64 color = 4;
}

// hlo.proto: BufferAllocationProto
//   One physical chunk of HBM that XLA reserves at compile time. Multiple
//   logical buffers may share the same allocation at non-overlapping
//   lifetimes (their (offset, size) ranges are recorded under `assigned`).
//   The sum of `size` over all BufferAllocationProto instances equals the
//   compile-time HBM peak shown by TensorBoard's Memory Viewer.
message BufferAllocationProto {
  // hlo.proto: BufferAllocationProto.Assigned
  message Assigned {
    int64 logical_buffer_id = 1;
    int64 offset = 2;
    int64 size = 3;
  }
  int64 index = 1;
  int64 size = 2;
  bool is_thread_local = 3;
  bool is_entry_computation_parameter = 5;
  int64 parameter_number = 6;
  bool maybe_live_out = 7;
  int64 color = 8;
  repeated Assigned assigned = 9;
  repeated int64 parameter_shape_index = 10;
  bool is_tuple = 11;
  bool is_constant = 12;
  bool is_parameter_aliased_with_output = 13;
}

// hlo.proto: HeapSimulatorTrace
//   One trace per simulator run; events are ALLOC / FREE / SHARE_WITH on
//   logical buffer ids. memory-profile prefers the entry-computation
//   schedule sweep over these traces because traces only cover thread-local
//   sub-allocations on most modern XLA captures.
message HeapSimulatorTrace {
  // hlo.proto: HeapSimulatorTrace.Event
  message Event {
    enum Kind {
      ALLOC = 0;
      FREE = 1;
      SHARE_WITH = 2;
    }
    Kind kind = 1;
    int64 buffer_id = 2;
    string computation_name = 3;
    string instruction_name = 4;
    int64 share_with_canonical_id = 5;
  }
  repeated Event events = 1;
  bool whole_module_simulation = 2;
  int64 buffer_allocation_index = 3;
}

// hlo.proto: BufferAssignmentProto
//   Top-level record carried as HloProto.buffer_assignment. Fields 1/3 are
//   the canonical sources of truth for memory-profile; fields 2/4 are
//   informational and not currently consumed.
message BufferAssignmentProto {
  // hlo.proto: BufferAssignmentProto.BufferAlias
  message BufferAlias {
    int64 source_buffer_id = 1;
    LogicalBufferProto.Location location = 2;
  }
  repeated LogicalBufferProto logical_buffers = 1;
  repeated BufferAlias buffer_aliases = 2;
  repeated BufferAllocationProto buffer_allocations = 3;
  repeated HeapSimulatorTrace heap_simulator_traces = 4;
}

// hlo.proto: HloScheduleProto
message HloScheduleProto {
  // hlo.proto: HloScheduleProto.InstructionSequence
  message InstructionSequence {
    repeated int64 instruction_ids = 1;
  }
  // Map keys are HloComputationProto.id values.
  map<int64, InstructionSequence> sequences = 1;
}
